  if (!audioCtx) return;

  const g = audioCtx.createGain();

  if (recycle && loopsInTrack >= target) {
    selectTrack(TRACKS[(trackIdx + 1) % TRACKS.length].name);
  }
}
function toggleRecycle() {
  recycle = !recycle;
  localStorage.setItem('flappy-recycle', recycle ? 'on' : 'off');
  tone(880, 0.06, 'sine', 0.07);
}
function selectTrack(name) {
  const idx = TRACKS.findIndex(t => t.name === name);
  if (idx < 0 || idx === trackIdx) return;
  trackIdx = idx;
  localStorage.setItem('flappy-track', name);
  musicStep = 0; musicLoop = 0; loopsInTrack = 0;
  trackStartAt = audioCtx ? audioCtx.currentTime : 0;
  if (TRACKS[trackIdx].gen) infReset();
  if (audioCtx) {
    musicNext = audioCtx.currentTime + 0.1;
    // kill all pending/sounding notes so tracks don't overlap
    const now = audioCtx.currentTime;
    for (const g of liveNotes) {
      g.gain.cancelScheduledValues(now);
      g.gain.setTargetAtTime(0, now, 0.03);
    }
    liveNotes.clear();
  }
  if (vinylGain && audioCtx) {
    vinylGain.gain.setTargetAtTime(TRACKS[trackIdx].vinyl ? 0.010 : 0, audioCtx.currentTime, 0.2);
  }
  if (reverbWet && audioCtx) {
    reverbWet.gain.setTargetAtTime(TRACKS[trackIdx].reverb || 0.15, audioCtx.currentTime, 0.4);
  }
  tone(660, 0.08, 'sine', 0.08);
}
function cycleTrack() {
  selectTrack(TRACKS[(trackIdx + 1) % TRACKS.length].name);
}
function toggleMusic() {
  musicOn = !musicOn;
  localStorage.setItem('flappy-music', musicOn ? 'on' : 'off');
  if (musicGain && audioCtx) {
    musicGain.gain.setTargetAtTime(musicOn ? 0.9 : 0, audioCtx.currentTime, 0.08);
  }
}
// pause in background tabs; re-claim playback when visible (mutes older tabs)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
  } else {
    try { localStorage.setItem('flappy-tab', myTabId); } catch (e) {}
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (musicGain && audioCtx) {
      musicGain.gain.setTargetAtTime(musicOn ? 0.9 : 0, audioCtx.currentTime, 0.3);
    }
  }
});
window.addEventListener('storage', (e) => {
  if (e.key === 'flappy-tab' && e.newValue !== myTabId) {
    if (musicGain && audioCtx) musicGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
  }
});
// ---------- particles ----------
function spawnParticle(o) {
  if (particles.length < 90) {
    particles.push({ x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,
                     life: o.life || 0.6, age: 0, size: o.size || 3,
                     color: o.color || '#ffffff', type: o.type || 'dot' });
  }
}
function puff(x, y, n, color, size) {
  for (let i = 0; i < n; i++) {
    spawnParticle({ x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 8,
                    vx: -40 - Math.random() * 60, vy: -20 - Math.random() * 40,
                    life: 0.35 + Math.random() * 0.25, size: size || 3, color, type: 'puff' });
  }
}

// ---------- actions ----------
function flap() {
  if (state === 'playing') {
    bird.vy = flapVy();
    puff(BIRD_X - 8, bird.y + 6, 3, 'rgba(255,255,255,0.9)', 3);
    sfx('flap');
  }
}
function start() {
  state = 'playing';
  bird.y = H / 2; bird.vy = flapVy() * 0.7; bird.rot = 0;
  pipes = []; score = 0; distSincePipe = 0;
  sfx('flap');
}
function reset() {
  bird = { y: H / 2, vy: 0, rot: 0 };
  pipes = []; particles = []; score = 0; distSincePipe = 0;
  state = 'ready'; grounded = false; shake = 0;
}
function die() {
  state = 'dead';
  grounded = false;
  shake = 0.25;
  newBest = score > best && score > 0;
  for (let i = 0; i < 8; i++) {
    spawnParticle({ x: BIRD_X, y: bird.y, vx: -30 - Math.random() * 90, vy: -60 - Math.random() * 120,
                    life: 0.6 + Math.random() * 0.5, size: 3 + Math.random() * 2,
                    color: i % 2 ? '#ffd93b' : '#fff3c4', type: 'feather' });
  }
  sfx('hit');
  if (score > best) { best = score; localStorage.setItem("flappy-best", String(best)); }
  if (score > 0 && window.LB) window.LB.submit("flappy", score);
}
const DIFF_BTNS = DIFF_ORDER.map((d, i) => ({ d, x: 50 + i * 100, y: 432, w: 100, h: 40 }));
function hitDiff(x, y) {
  for (const b of DIFF_BTNS) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.d;
  }
  return null;
}
const MUTE_BTN = { x: 366, y: 27, r: 17 };
const MUSIC_BTN = { x: 34, y: 27, r: 16 };
const RECYCLE_BTN = { x: 70, y: 27, r: 16 };
function hitMute(x, y) {
  return (x - MUTE_BTN.x) ** 2 + (y - MUTE_BTN.y) ** 2 <= (MUTE_BTN.r + 4) ** 2;
}
function hitRecycle(x, y) {
  return (x - RECYCLE_BTN.x) ** 2 + (y - RECYCLE_BTN.y) ** 2 <= (RECYCLE_BTN.r + 4) ** 2;
}
function hitMusicBtn(x, y) {
  return (x - MUSIC_BTN.x) ** 2 + (y - MUSIC_BTN.y) ** 2 <= (MUSIC_BTN.r + 4) ** 2;
}
function hitMusicRow(x, y) {
  if (x < 10 || x > 160) return null;
  for (let i = 0; i < TRACKS.length; i++) {
    if (y >= 50 + i * 34 && y <= 80 + i * 34) return TRACKS[i].name;
  }
  return null;
}
function onInput(x, y) {
  ensureAudio();
  if (state === 'ready') {
    if (hitMute(x, y)) { musicMenuOpen = false; toggleMusic(); return; }
    if (hitRecycle(x, y)) { toggleRecycle(); return; }
    if (musicMenuOpen) {
      const row = hitMusicRow(x, y);
      musicMenuOpen = false;
      if (row) selectTrack(row);
      return;                       // any click while open just closes the menu
    }
    if (hitMusicBtn(x, y)) { musicMenuOpen = true; return; }
    const picked = hitDiff(x, y);
    if (picked) {
      diff = picked;
      localStorage.setItem('flappy-diff', diff);
      sfx('score');
    } else {
      start();
    }
  }
  else if (state === 'playing') flap();
  else if (state === 'dead' && grounded) reset();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onInput(-1, -1); }
  else if (e.key === 'm' || e.key === 'M') { ensureAudio(); toggleMusic(); }
  else if (e.key === 't' || e.key === 'T') { ensureAudio(); cycleTrack(); }
  else if (e.key === 'c' || e.key === 'C') { ensureAudio(); toggleRecycle(); }
  else if (state === 'ready' && (e.key === '1' || e.key === '2' || e.key === '3')) {
    diff = DIFF_ORDER[+e.key - 1];
    localStorage.setItem('flappy-diff', diff);
    sfx('score');
  }
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  onInput((e.clientX - rect.left) * (W / rect.width), (e.clientY - rect.top) * (H / rect.height));
});

// ---------- update ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  time += dt;
  if (shake > 0) shake -= dt;
  if (state !== 'dead') worldX += speed() * dt;

  for (const c of clouds) {
    c.x -= c.v * dt;
    if (c.x < -80) { c.x = W + 60; c.y = 30 + Math.random() * 240; }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.type === 'puff' ? -30 : 420) * dt;
    if (p.type === 'puff') p.vx *= (1 - 2 * dt);
  }

  if (state === 'ready') {
    bird.y = H / 2 + Math.sin(time * 3.2) * 8;
    bird.rot = Math.sin(time * 3.2) * 0.08;
  } else if (state === 'playing') {
    bird.vy = Math.min(bird.vy + gravity() * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy / 520 + 0.15));

    distSincePipe += speed() * dt;
    if (distSincePipe >= spacing()) {
      distSincePipe -= spacing();
      const g = gap();
      const minY = 70, maxY = GROUND_Y - g - 70;
      pipes.push({ x: W + 10, gapY: minY + Math.random() * (maxY - minY), gap: g, scored: false });
    }
    for (const p of pipes) {
      p.x -= speed() * dt;
      if (!p.scored && p.x + PIPE_WIDTH < BIRD_X - BIRD_R) { p.scored = true; score++; sfx('score'); }
    }
    pipes = pipes.filter(p => p.x > -PIPE_WIDTH);

    if (bird.y + BIRD_R >= GROUND_Y) { bird.y = GROUND_Y - BIRD_R; die(); }
    else if (bird.y - BIRD_R <= 0) { bird.y = BIRD_R; bird.vy = Math.max(bird.vy, 0); }
    for (const p of pipes) {
      if (BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_WIDTH) {
        if (bird.y - BIRD_R < p.gapY || bird.y + BIRD_R > p.gapY + p.gap) die();
      }
    }
  } else if (state === 'dead') {
    if (!grounded) {
      bird.vy = Math.min(bird.vy + gravity() * 1.3 * dt, MAX_FALL * 1.4);
      bird.y += bird.vy * dt;
      bird.rot = Math.min(1.57, bird.rot + 5 * dt);
      if (bird.y + BIRD_R >= GROUND_Y) {
        bird.y = GROUND_Y - BIRD_R; grounded = true; bird.rot = 1.4;
        puff(BIRD_X, GROUND_Y - 4, 10, 'rgba(222,192,140,0.9)', 4);
      }
    }
  }

  draw();
  requestAnimationFrame(frame);
}

// ---------- draw ----------
function draw() {
  ctx.save();
  if (shake > 0) {
    const k = shake / 0.25;
    ctx.translate((Math.random() - 0.5) * 8 * k, (Math.random() - 0.5) * 8 * k);
  }

  // sky + sun
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-10, -10, W + 20, H + 10);
  const sunGlow = ctx.createRadialGradient(330, 88, 6, 330, 88, 95);
  sunGlow.addColorStop(0, 'rgba(255,250,214,0.95)');
  sunGlow.addColorStop(1, 'rgba(255,250,214,0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(220, 0, 200, 200);
  ctx.fillStyle = '#fff8d8';
  ctx.beginPath(); ctx.arc(330, 88, 26, 0, Math.PI * 2); ctx.fill();

  // hills (scroll with the world, same speed as pipes)
  drawHills(GROUND_Y - 130, 46, 0.007, 'rgba(178,224,206,0.65)');
  drawHills(GROUND_Y - 74, 58, 0.011, '#8fd06a');

  // clouds
  for (const c of clouds) {
    drawCloud(c.x, c.y, c.s);
  }

  // pipes
  for (const p of pipes) {
    drawPipe(p.x, 0, p.gapY, true);
    drawPipe(p.x, p.gapY + p.gap, GROUND_Y - (p.gapY + p.gap), false);
  }

  // ground
  drawGround();

  // particles behind/around bird
  drawParticles();

  // bird
  drawBird();

  // vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.75);
  vig.addColorStop(0, 'rgba(15,35,60,0)');
  vig.addColorStop(1, 'rgba(15,35,60,0.22)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();

  drawUI();
}

function drawHills(baseY, amp, freq, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-10, GROUND_Y);
  const phase = worldX * freq;
  for (let x = -10; x <= W + 30; x += 18) {
    const y = baseY + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.7 + phase * 2.7) * amp * 0.35;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 30, GROUND_Y);
  ctx.closePath();
  ctx.fill();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(120,190,220,0.28)';
  ctx.beginPath();
  ctx.ellipse(x + 6 * s, y + 14 * s, 26 * s, 9 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
  ctx.arc(x + 20 * s, y + 4 * s, 16 * s, 0, Math.PI * 2);
  ctx.arc(x - 18 * s, y + 6 * s, 14 * s, 0, Math.PI * 2);
  ctx.arc(x + 6 * s, y - 8 * s, 14 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipe(x, top, h, isTop) {
  // body outline
  ctx.fillStyle = '#3d7a1e';
  ctx.fillRect(x - 3, top, PIPE_WIDTH + 6, h);
  // body
  const grad = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
  grad.addColorStop(0, '#5fae2f');
  grad.addColorStop(0.18, '#8ed14d');
  grad.addColorStop(0.55, '#a6e063');
  grad.addColorStop(0.82, '#6fbf3a');
  grad.addColorStop(1, '#4d9927');
  ctx.fillStyle = grad;
  ctx.fillRect(x, top, PIPE_WIDTH, h);
  // gloss
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(x + 5, top, 9, h);
  // cap
  const capH = 24, capX = x - 5, capW = PIPE_WIDTH + 10;
  const capTop = isTop ? top + h - capH : top;
  ctx.fillStyle = '#3d7a1e';
  roundRect(capX - 2, capTop - 2, capW + 4, capH + 4, 6);
  ctx.fill();
  const cg = ctx.createLinearGradient(capX, 0, capX + capW, 0);
  cg.addColorStop(0, '#8ed14d');
  cg.addColorStop(0.5, '#a6e063');
  cg.addColorStop(1, '#5da832');
  ctx.fillStyle = cg;
  roundRect(capX, capTop, capW, capH, 6);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  roundRect(capX + 4, capTop + 3, 9, capH - 6, 3);
  ctx.fill();
}

function drawGround() {
  // dirt
  const dg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  dg.addColorStop(0, '#d9b877');
  dg.addColorStop(1, '#c39a5c');
  ctx.fillStyle = dg;
  ctx.fillRect(-10, GROUND_Y, W + 20, GROUND_H + 10);
  // scrolling diagonal stripes across dirt (leftward, world speed)
  const off = -(worldX % 48);
  ctx.fillStyle = 'rgba(255,240,200,0.35)';
  for (let x = -96 + off; x < W + 48; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x + 24, GROUND_Y);
    ctx.lineTo(x, H + 10);
    ctx.lineTo(x - 24, H + 10);
    ctx.closePath();
    ctx.fill();
  }
  // grass band
  const gg = ctx.createLinearGradient(0, GROUND_Y - 10, 0, GROUND_Y + 22);
  gg.addColorStop(0, '#b2e86e');
  gg.addColorStop(1, '#7cbf45');
  ctx.fillStyle = gg;
  ctx.fillRect(-10, GROUND_Y - 10, W + 20, 32);
  // scrolling stripes across grass
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for (let x = -96 + off; x < W + 48; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y - 10);
    ctx.lineTo(x + 24, GROUND_Y - 10);
    ctx.lineTo(x, GROUND_Y + 22);
    ctx.lineTo(x - 24, GROUND_Y + 22);
    ctx.closePath();
    ctx.fill();
  }
  // grass edge
  ctx.fillStyle = '#d8f7a8';
  ctx.fillRect(-10, GROUND_Y - 12, W + 20, 5);
  // grass tufts
  ctx.strokeStyle = '#5d9c33';
  ctx.lineWidth = 2;
  const toff = -(worldX % 90);
  for (let x = -180 + toff; x < W + 90; x += 90) {
    const tx = x + 20 + Math.sin((x + worldX) * 0.7) * 8;
    for (let b = -1; b <= 1; b++) {
      ctx.beginPath();
      ctx.moveTo(tx, GROUND_Y - 10);
      ctx.lineTo(tx + b * 4, GROUND_Y - 20 - Math.abs(b) * 3);
      ctx.stroke();
    }
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(BIRD_X, bird.y);
  // drop shadow
  ctx.fillStyle = 'rgba(30,60,20,0.18)';
  ctx.beginPath(); ctx.ellipse(2, 11, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(bird.rot);
  // tail feathers
  ctx.fillStyle = '#f4b400';
  ctx.beginPath();
  ctx.moveTo(-12, -3); ctx.lineTo(-21, -8); ctx.lineTo(-15, 0);
  ctx.lineTo(-21, 7); ctx.lineTo(-12, 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d99a10'; ctx.lineWidth = 1.5; ctx.stroke();
  // body
  const bg = ctx.createRadialGradient(-3, -4, 4, 0, 0, 18);
  bg.addColorStop(0, '#ffe873');
  bg.addColorStop(0.75, '#ffd93b');
  bg.addColorStop(1, '#f2b705');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#c98f0e'; ctx.stroke();
  // belly
  ctx.fillStyle = 'rgba(255,248,220,0.85)';
  ctx.beginPath(); ctx.ellipse(2, 6, 10, 6, 0.15, 0, Math.PI * 2); ctx.fill();
  // wing
  const wf = state === 'dead' ? 0 : Math.sin(time * 18) * 0.5;
  ctx.save();
  ctx.translate(-5, 2);
  ctx.rotate(-0.15 - wf);
  const wg = ctx.createLinearGradient(0, -8, 0, 8);
  wg.addColorStop(0, '#fff3c4');
  wg.addColorStop(1, '#f5c542');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.ellipse(-2, 0, 10, 6, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#d99a10'; ctx.stroke();
  ctx.restore();
  // eye
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(8, -4, 6, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#c98f0e'; ctx.stroke();
  if (state === 'dead') {
    ctx.strokeStyle = '#20242b'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(5, -7); ctx.lineTo(11, -1);
    ctx.moveTo(11, -7); ctx.lineTo(5, -1);
    ctx.stroke();
    ctx.lineCap = 'butt';
  } else {
    ctx.fillStyle = '#20242b';
    ctx.beginPath(); ctx.arc(10, -4, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(11.2, -5.2, 1, 0, Math.PI * 2); ctx.fill();
  }
  // beak
  const bkg = ctx.createLinearGradient(0, -2, 0, 5);
  bkg.addColorStop(0, '#ff9a3c');
  bkg.addColorStop(1, '#f05a1a');
  ctx.fillStyle = bkg;
  ctx.beginPath();
  ctx.moveTo(14, -2); ctx.lineTo(24, 0.5); ctx.lineTo(24, 2.5); ctx.lineTo(14, 5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c94010'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    if (p.type === 'feather') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.age * 6);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - p.age / p.life * 0.4), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawUI() {
  ctx.textAlign = 'center';
  if (state === 'ready') {
    const pulse = 1 + Math.sin(time * 4) * 0.03;
    ctx.save();
    ctx.translate(W / 2, 92);
    ctx.scale(pulse, pulse);
    outlined('FLAPPY BIRD', 0, 0, '#ffd93b', '#8a5c00', 36);
    ctx.restore();
    outlined('TAP or SPACE to flap', W / 2, 190, '#ffffff', '#33506e', 16);
    // music selector: small corner button + current track name
    ctx.beginPath();
    ctx.arc(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.r, 0, Math.PI * 2);
    ctx.fillStyle = musicMenuOpen ? 'rgba(168,228,240,0.9)' : 'rgba(255,255,255,0.25)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(51,80,110,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = musicMenuOpen ? '#1c3a55' : '#ffffff';
    ctx.font = 'bold 15px Arial, sans-serif';
    ctx.fillText('\u266B', MUSIC_BTN.x, MUSIC_BTN.y + 5);
    // recycle toggle
    ctx.beginPath();
    ctx.arc(RECYCLE_BTN.x, RECYCLE_BTN.y, RECYCLE_BTN.r, 0, Math.PI * 2);
    ctx.fillStyle = recycle ? 'rgba(168,228,240,0.9)' : 'rgba(255,255,255,0.25)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(51,80,110,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = recycle ? '#1c3a55' : '#ffffff';
    ctx.font = 'bold 15px Arial, sans-serif';
    ctx.fillText('\u21BB', RECYCLE_BTN.x, RECYCLE_BTN.y + 5);
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px Arial, sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#33506e';
    ctx.strokeText(TRACKS[trackIdx].name, 94, 32);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(TRACKS[trackIdx].name, 94, 32);
    ctx.textAlign = 'center';
    if (musicMenuOpen) {
      ctx.fillStyle = 'rgba(20,40,60,0.88)';
      roundRect(8, 46, 154, TRACKS.length * 34 + 6, 10);
      ctx.fill();
      for (let i = 0; i < TRACKS.length; i++) {
        const t = TRACKS[i];
        const ry = 52 + i * 34;
        if (t.name === TRACKS[trackIdx].name) {
          ctx.fillStyle = 'rgba(168,228,240,0.25)';
          roundRect(14, ry - 16, 142, 30, 6);
          ctx.fill();
        }
        ctx.fillStyle = t.name === TRACKS[trackIdx].name ? '#a8e4f0' : '#e8eef2';
        ctx.font = (t.name === TRACKS[trackIdx].name ? 'bold ' : '') + '13px Arial, sans-serif';
        ctx.fillText(t.name, 85, ry + 4);
      }
    }
    // mute toggle
    ctx.beginPath();
    ctx.arc(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.r, 0, Math.PI * 2);
    ctx.fillStyle = musicOn ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(51,80,110,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = musicOn ? '#ffffff' : '#aab6c0';
    ctx.font = 'bold 17px Arial, sans-serif';
    ctx.fillText('\u266A', MUTE_BTN.x, MUTE_BTN.y + 6);
    if (!musicOn) {
      ctx.strokeStyle = '#e35d2a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(MUTE_BTN.x - 11, MUTE_BTN.y + 11);
      ctx.lineTo(MUTE_BTN.x + 11, MUTE_BTN.y - 11);
      ctx.stroke();
    }
    outlined('DIFFICULTY', W / 2, 408, '#ffffff', '#33506e', 15);
    for (const b of DIFF_BTNS) {
      const sel = b.d === diff;
      ctx.fillStyle = sel ? '#ffd93b' : 'rgba(255,255,255,0.22)';
      roundRect(b.x, b.y, b.w, b.h, 10);
      ctx.fill();
      ctx.strokeStyle = sel ? '#8a5c00' : 'rgba(51,80,110,0.8)';
      ctx.lineWidth = sel ? 3 : 2;
      roundRect(b.x, b.y, b.w, b.h, 10);
      ctx.stroke();
      ctx.fillStyle = sel ? '#5a3c00' : '#ffffff';
      ctx.font = 'bold 16px Arial, sans-serif';
      ctx.fillText(b.d.toUpperCase(), b.x + b.w / 2, b.y + 26);
    }
  }
  if (state === 'playing') {
    outlined(String(score), W / 2, 82, '#ffffff', '#33506e', 46);
  }
  if (state === 'dead' && grounded) {
    const pw = 272, ph = 186, px = (W - pw) / 2, py = 185;
    ctx.fillStyle = '#e8d9a8';
    roundRect(px, py, pw, ph, 14);
    ctx.fill();
    ctx.strokeStyle = '#b89a55'; ctx.lineWidth = 3;
    roundRect(px, py, pw, ph, 14);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(px + 6, py + 6, pw - 12, 40, 8);
    ctx.fill();

    outlined('GAME OVER', W / 2, py + 44, '#e35d2a', '#8a2c08', 26);

    // medal
    const medal = score >= 30 ? 'gold' : score >= 15 ? 'silver' : score >= 5 ? 'bronze' : null;
    if (medal) {
      const mx = px + 66, my = py + 104, mr = 26;
      const mc = { gold: ['#ffe98a', '#d4a017'], silver: ['#eef2f5', '#9aa7b0'], bronze: ['#f0b088', '#b06a2c'] }[medal];
      const mg = ctx.createRadialGradient(mx - 8, my - 10, 4, mx, my, mr);
      mg.addColorStop(0, mc[0]);
      mg.addColorStop(1, mc[1]);
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(90,60,10,0.5)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(mx - 9, my - 11, 7, 0, Math.PI * 2); ctx.fill();
    }

    ctx.font = 'bold 15px Arial, sans-serif';
    ctx.fillStyle = '#6a5626';
    ctx.fillText('SCORE', px + 168, py + 86);
    ctx.font = 'bold 30px Arial, sans-serif';
    ctx.fillStyle = '#4a3c14';
    ctx.fillText(String(score), px + 168, py + 118);
    ctx.font = 'bold 15px Arial, sans-serif';
    ctx.fillStyle = '#6a5626';
    ctx.fillText('BEST', px + 168, py + 142);
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.fillStyle = '#4a3c14';
    ctx.fillText(String(best), px + 168, py + 168);

    if (newBest) {
      ctx.fillStyle = '#e35d2a';
      ctx.font = 'bold 13px Arial, sans-serif';
      ctx.fillText('NEW!', px + 216, py + 142);
    }

    if (Math.floor(time * 2) % 2 === 0) {
      ctx.font = '14px Arial, sans-serif';
      ctx.fillStyle = '#8a7a44';
      ctx.fillText('TAP or SPACE to retry', W / 2, py + 176);
    }
  }
}

function outlined(text, x, y, fill, stroke, size) {
  ctx.font = `bold ${size}px "Arial Black", Arial, sans-serif`;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.22);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Read-only test hook; enabled only via ?debug=1
if (new URLSearchParams(location.search).get('debug') === '1') {
  let analyser = null, levelBuf = null;
  window.__flappy = {
    getState: () => {
      let peak = 0;
      if (musicGain) {
        if (!analyser) {
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          musicGain.connect(analyser);
          levelBuf = new Float32Array(analyser.fftSize);
        }
        analyser.getFloatTimeDomainData(levelBuf);
        for (let i = 0; i < levelBuf.length; i += 4) {
          const v = Math.abs(levelBuf[i]);
          if (v > peak) peak = v;
        }
      }
      return { state, score, best, diff, birdY: bird.y, grounded, worldX,
               musicOn, audioReady: !!audioCtx, musicRunning: !!musicTimer,
               track: TRACKS[trackIdx].name, musicStep, notesScheduled, recycle, loopsInTrack,
               ctxState: audioCtx ? audioCtx.state : 'none', menuOpen: musicMenuOpen,
               outPeak: +peak.toFixed(3),
               speed: speed(), gap: gap(),
               pipes: pipes.map(p => ({ x: p.x, gapY: p.gapY, gap: p.gap })) };
    },
    testTone: () => tone(440, 0.5, 'sine', 0.2),
    testPluck: () => pluck(69, audioCtx.currentTime + 0.05, 0.3, 1.0, PARTIALS),
    testKick: () => mKick(audioCtx.currentTime + 0.05),
    selectTrack: (name) => selectTrack(name)
  };
}

requestAnimationFrame(frame);
})();
</script>
